<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="Assets/Favicon.png" alt="favicon">
<title>Appreciation</title>
<style>
  body {
    font-family: 'fredoka';
    background: #1a1a2e;
    color: #E0E0E0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0 20px;
    text-align: center;
  }

  .thank-container {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(12px);
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    max-width: 500px;
  }

  h1 {
    font-size: 2rem;
    color: #5865f2;
    margin-bottom: 20px;
  }

  p {
    font-size: 1.1rem;
    line-height: 1.6;
    margin-bottom: 30px;
    color: #AAAAAA;
  }

  a.button {
    display: inline-block;
    padding: 12px 25px;
    background: linear-gradient(45deg, #5865f2, #7289da);
    color: #fff;
    text-decoration: none;
    border-radius: 12px;
    font-size: 1rem;
    transition: transform 0.2s ease;
  }

  a.button:hover {
    transform: scale(1.05);
  }
</style>
</head>
<body>
  <div class="thank-container">
    <h1>Thank You!</h1>
    <p>Your message is on its way! We will receive your message and try to reply as soon as possible. We really appreciate 
        your thoughts and feedback!</p>
    <a href="index.html" class="button">Go Back</a>
  </div>
</body>
</html>
